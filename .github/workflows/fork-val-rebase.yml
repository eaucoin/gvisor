# Spike, not for main (named fork-* so that fork-integrate.yml leaves it
# enabled): the kernel-standby validation's rebase of the fork's series onto
# upstream master (the endpoint package's M6 rebase spike), checked as tier 1
# checks main, on every push of a spike/val-rebase branch: the Bazel build
# and the affected tests, pinned to the CPU and kernel that the package's
# measurements use. The checks and the go branch build, which passed at
# be15019ec0 (run 41310522894), run again at the end.
name: Rebase spike

"on":
  push:
    branches:
      - spike/val-rebase*

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BAZEL_REMOTE_CACHE: --disk_cache=/home/runner/.cache/bazel/disk
  TEST_OPTIONS: --modify_execution_info=TestRunner=+no-cache
  # The base comes from this commit's own SERIES, not from series/fork-infra.
  SERIES_REF: ${{ github.sha }}

jobs:
  # The Bazel job passed at d9edc28bb7 (run 41317539294: the release build, both
  # engines' smoke test, runsc/container's tests built, 179 of 179 affected
  # tests); only this workflow changes since, so tier 1's checks and the go
  # branch build finish it.
  checks:
    name: Lint, license headers and documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: base
        run: echo "base=$(tools/fork/series.sh base)" >>"${GITHUB_OUTPUT}"
      - name: License headers
        run: tools/check_license_headers.sh "${{ steps.base.outputs.base }}"
      - name: Documentation links
        run: tools/fork/check_links.sh "${{ steps.base.outputs.base }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint
        run: make lint

  go:
    name: Go branch build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate the go branch
        run: |
          git config --global user.name "gVisor bot"
          git config --global user.email "gvisor-bot@google.com"
          tools/go_branch.sh
          git checkout go
          git clean -xffd
      - name: go build ./...
        run: go build ./...
