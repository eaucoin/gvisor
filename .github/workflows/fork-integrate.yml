# Keeps main made of the series in SERIES, and every series tested.
#
# Every quarter of an hour, after every tier-1 run, and on demand, it:
# - disables every workflow that is not the fork's own (fork-*.yml): upstream's
#   push the go branch, mirror upstream releases or need upstream's secrets;
# - rebuilds main with tools/fork/series.sh from the longest prefix of SERIES
#   whose tips all passed tier 1 and still sit on their prerequisites, and
#   pushes it if it changed: main stays green while a series waits for its
#   fixes or its rebase. A series that does not apply opens an issue (kept
#   current, not commented on every run), closed by the next successful
#   rebuild;
# - then dispatches tier 1 (fork-ci.yml) for each series tip that has no
#   "fork-ci" status yet, or one from a cancelled run: with main's workflows
#   as just pushed, or, for the fork's own series (series/fork-*), which
#   change the workflows, with their own.
name: Fork integrate

"on":
  schedule:
    - cron: "7,22,37,52 * * * *"
  # GitHub runs schedules late or not at all under load: a finished tier 1
  # also starts it, so that main follows its series at once.
  workflow_run:
    workflows: [Fork CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

# bash with -o pipefail, so that a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      issues: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Disable upstream's workflows
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | select(.path | test("^\\.github/workflows/fork-[^/]+\\.yml$") | not) | "\(.id) \(.path)"' |
            while read -r id path; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
              echo "Disabled ${path}" | tee -a "${GITHUB_STEP_SUMMARY}"
            done

      - name: Find the series' tier 1 results
        id: series
        run: |
          declare -A state=()
          : >"${RUNNER_TEMP}/untested"
          for ref in $(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/series/'); do
            sha="$(git rev-parse "refs/remotes/origin/${ref}")"
            state["${ref}"]="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/statuses" \
              --jq '[.[] | select(.context == "fork-ci")][0].state // "none"')"
            # "error" is a cancelled run: run it again.
            if [[ "${state[${ref}]}" == none || "${state[${ref}]}" == error ]]; then
              echo "${ref} ${sha}" >>"${RUNNER_TEMP}/untested"
            fi
            echo "- ${ref} \`${sha:0:12}\`: ${state[${ref}]}" >>"${GITHUB_STEP_SUMMARY}"
          done
          # main carries the longest prefix of SERIES whose series all passed
          # tier 1 and still sit on the series they are declared on.
          green=0
          while read -r ref; do
            [[ "${state[${ref}]:-none}" == success ]] || break
            tools/fork/series.sh check "${ref}" >/dev/null || break
            green=$((green + 1))
          done < <(git show origin/series/fork-infra:SERIES | sed 's/#.*//' | awk '$1 ~ /^series\// {print $1}')
          echo "green=${green}" >>"${GITHUB_OUTPUT}"
          echo "main can carry the first ${green} series of SERIES." >>"${GITHUB_STEP_SUMMARY}"

      - name: Rebuild main
        id: build
        # Never without the fork's own series, which holds these workflows.
        if: steps.series.outputs.green > 0
        env:
          GREEN: ${{ steps.series.outputs.green }}
        run: |
          if ! tools/fork/series.sh build "${GREEN}" >"${RUNNER_TEMP}/main" 2>"${RUNNER_TEMP}/build.log"; then
            cat "${RUNNER_TEMP}/build.log"
            exit 1
          fi
          new="$(cat "${RUNNER_TEMP}/main")"
          old="$(git rev-parse --verify --quiet refs/remotes/origin/main || true)"
          # A note on main's tip records what it was built from, for the
          # release notes: the base, then "BRANCH TIP COMMITS" per series.
          {
            echo "base $(tools/fork/series.sh base)"
            tools/fork/series.sh list | sed -n "1,${GREEN}p"
          } >"${RUNNER_TEMP}/note"
          git fetch --quiet origin refs/notes/series:refs/notes/series || true
          if ! git notes --ref=series show "${new}" 2>/dev/null | cmp -s - "${RUNNER_TEMP}/note"; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              notes --ref=series add -f -F "${RUNNER_TEMP}/note" "${new}"
            echo "note=changed" >>"${GITHUB_OUTPUT}"
          fi
          echo "new=${new}" >>"${GITHUB_OUTPUT}"
          echo "old=${old}" >>"${GITHUB_OUTPUT}"
          {
            if [[ "${new}" == "${old}" ]]; then
              echo "main is up to date at ${new}, built from:"
            else
              echo "main: ${old:-none} → ${new}, built from:"
            fi
            sed 's/^/- /' "${RUNNER_TEMP}/note"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Push main
        if: steps.build.outcome == 'success' && (steps.build.outputs.new != steps.build.outputs.old || steps.build.outputs.note == 'changed')
        env:
          FORK_PUSH_KEY: ${{ secrets.FORK_PUSH_KEY }}
          NEW: ${{ steps.build.outputs.new }}
          OLD: ${{ steps.build.outputs.old }}
        run: |
          tools/fork/push.sh --atomic --force-with-lease="refs/heads/main:${OLD}" \
            "${NEW}:refs/heads/main" refs/notes/series:refs/notes/series

      # After the rebuild, so that the dispatched runs use main's workflows as
      # just pushed.
      - name: Test untested series
        if: always() && steps.series.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while read -r ref sha; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=pending \
              -f context=fork-ci -f description="Tier 1 queued" -f target_url="${RUN_URL}" >/dev/null
            # The fork's own series carry the workflows: they are tested with
            # their own, every other series with main's.
            workflow_ref=main
            if [[ "${ref}" == series/fork-* ]]; then
              workflow_ref="${ref}"
            fi
            gh workflow run fork-ci.yml --ref "${workflow_ref}" -f ref="${ref}"
            echo "Dispatched tier 1 for ${ref}" >>"${GITHUB_STEP_SUMMARY}"
          done <"${RUNNER_TEMP}/untested"

      - name: Report a failed rebuild
        if: always() && steps.build.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="main cannot be rebuilt from SERIES"
          issue="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [[ "${OUTCOME}" == success ]]; then
            if [[ -n "${issue}" ]]; then
              gh issue close "${issue}" --comment "Rebuilt by ${RUN_URL}."
            fi
          else
            # shellcheck disable=SC2016 # The backquotes are Markdown's.
            body="$(printf '%s\n\n```text\n%s\n```\n' "Last failed run: ${RUN_URL}" "$(tail -n 50 "${RUNNER_TEMP}/build.log" 2>/dev/null)")"
            if [[ -n "${issue}" ]]; then
              gh issue edit "${issue}" --body "${body}"
            else
              gh issue create --title "${title}" --body "${body}"
            fi
          fi
