# Tier 3 of the fork's CI: the checkpoint/restore bench (tools/fork/bench),
# weekly on main, for every release, and on demand for any branch or tag.
# tools/fork/bench/measure.sh lists what it measures (about 28 minutes): a
# workload dirtying 512 MiB checkpointed and restored in many ways, and the
# fork's incremental checkpoints, pre-copy, S3 store and working sets. A
# baseline, by default the upstream release that main is based on, is built
# and measured on the same runner, its repetitions interleaved with the
# measured build's, since runners differ more than the builds do. The results
# are kept as an artifact and compared with the previous weekly run on main,
# and a measurement more than 20 % worse fails.
name: Fork bench

"on":
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to measure
        required: true
        default: main
        type: string
      baseline:
        description: Branch or tag measured alongside (default the upstream release in SERIES; "none" for none)
        required: false
        default: ""
        type: string
      runsc_flags:
        description: Global runsc flags for the measured build, separated by spaces (e.g. --dirty-tracking=wp)
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

# bash with -o pipefail, so that a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

env:
  REF: ${{ inputs.ref || 'main' }}
  BASELINE: ${{ inputs.baseline }}
  RUNSC_FLAGS: ${{ inputs.runsc_flags }}
  BAZEL_REMOTE_CACHE: --disk_cache=/home/runner/.cache/bazel/disk

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          sparse-checkout: |
            SERIES
            tools/fork
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          ref: ${{ env.REF }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: meta
        working-directory: src
        run: |
          base="$(sed -n 's/^base \([^ #]*\).*/\1/p' ../fork/SERIES)"
          baseline="${BASELINE:-${base}}"
          if [[ "${baseline}" == none ]]; then
            baseline=""
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "base=${base}"
            echo "baseline=${baseline}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/bazel/disk
          key: bazel-${{ steps.meta.outputs.base }}-${{ steps.meta.outputs.sha }}
          restore-keys: bazel-${{ steps.meta.outputs.base }}-
      - name: Build runsc
        working-directory: src
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          make copy TARGETS=//:release DESTINATION="${RUNNER_TEMP}/release/"
          "${RUNNER_TEMP}/release/runsc" --version | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Build the baseline's runsc
        if: steps.meta.outputs.baseline != ''
        working-directory: src
        env:
          BASELINE_REF: ${{ steps.meta.outputs.baseline }}
        run: |
          git -c advice.detachedHead=false checkout --quiet "${BASELINE_REF}"
          mkdir -p "${RUNNER_TEMP}/baseline"
          make copy TARGETS=//:release DESTINATION="${RUNNER_TEMP}/baseline/"
          "${RUNNER_TEMP}/baseline/runsc" --version | sed 's/^/baseline: /' | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Prepare the workloads
        run: sudo python3 fork/tools/fork/bench/bench.py prepare
      - name: Measure
        run: |
          read -ra flags <<<"${RUNSC_FLAGS}"
          baseline=()
          if [[ -d "${RUNNER_TEMP}/baseline" ]]; then
            baseline=("${RUNNER_TEMP}/baseline/runsc")
          fi
          fork/tools/fork/bench/measure.sh "${RUNNER_TEMP}/bench" "${RUNNER_TEMP}/release/runsc" \
            "${baseline[@]}" -- "${flags[@]}"
          cat "${RUNNER_TEMP}/bench/summary.md" >>"${GITHUB_STEP_SUMMARY}"
      - name: Clean up
        if: always()
        run: sudo python3 fork/tools/fork/bench/bench.py clean --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ steps.meta.outputs.sha }}
          path: |
            ${{ runner.temp }}/bench/results.jsonl
            ${{ runner.temp }}/bench/baseline.jsonl
          if-no-files-found: ignore
          retention-days: 90
      - name: Compare with the previous weekly run
        run: |
          previous="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow fork-bench.yml --event schedule \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${previous}" ]]; then
            echo "No previous run to compare with." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          gh run download "${previous}" -R "${GITHUB_REPOSITORY}" --pattern 'bench-*' --dir "${RUNNER_TEMP}/previous"
          {
            echo "### Against run ${previous}"
            echo
          } >>"${GITHUB_STEP_SUMMARY}"
          python3 fork/tools/fork/bench/compare.py "${RUNNER_TEMP}"/previous/*/results.jsonl \
            "${RUNNER_TEMP}/bench/results.jsonl" | tee -a "${GITHUB_STEP_SUMMARY}"
